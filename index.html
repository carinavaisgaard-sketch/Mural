<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Mural</h1>
    <p class="tagline">A small wall of colorful ideas</p>
  </header>

  <main>
    <section class="quote-box">
      <p id="quote">Click the button for a random thought.</p>
      <button id="quote-btn">New thought</button>
    </section>

    <section>
      <h2>Tiles</h2>
      <p>Click a tile to repaint it.</p>
      <div id="wall" class="wall"></div>
    </section>
  </main>

  <footer>
    <p>Made with plain HTML, CSS and JavaScript.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
